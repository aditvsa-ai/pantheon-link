<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantheon pregled</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0b1220; color: #e7ecf5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 1.5rem;
    }
    .box { max-width: 26rem; text-align: center; }
    .logo {
      width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; border-radius: 0.9rem;
      background: linear-gradient(135deg, #2b6fff, #7aa2ff);
      display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    p { color: #9aa6bd; margin: 0.4rem 0; font-size: 0.95rem; }
    .spin {
      width: 1.1rem; height: 1.1rem; border: 2px solid #3a4866; border-top-color: #7aa2ff;
      border-radius: 50%; display: inline-block; vertical-align: -2px; margin-right: 0.4rem;
      animation: s 0.8s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
    a.btn {
      display: inline-block; margin-top: 1rem; padding: 0.7rem 1.4rem; border-radius: 0.7rem;
      background: #2b6fff; color: #fff; text-decoration: none; font-weight: 600; word-break: break-all;
    }
    a.btn:hover { background: #3f7dff; }
    .muted { font-size: 0.8rem; color: #6b778e; margin-top: 1.2rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">📦</div>
    <h1>Pantheon pregled</h1>
    <p id="status"><span class="spin"></span>Otvaram aplikaciju…</p>
    <a id="link" class="btn" href="#" style="display:none">Otvori aplikaciju</a>
    <p class="muted">Ova stranica te uvijek odvede na aktuelnu adresu aplikacije. Ako se ne otvori sama, klikni dugme ili osvježi (F5).</p>
  </div>
  <script>
    var API = 'https://api.github.com/repos/aditvsa-ai/pantheon-link/contents/link.txt';
    var RAW = 'https://raw.githubusercontent.com/aditvsa-ai/pantheon-link/main/link.txt';
    function prikaziLink(url) {
      var a = document.getElementById('link');
      a.href = url; a.textContent = url; a.style.display = 'inline-block';
      document.getElementById('status').textContent = 'Preusmjeravam…';
      location.replace(url);
    }
    function greska() {
      document.getElementById('status').textContent = 'Trenutno ne mogu dohvatiti adresu. Osvježi stranicu (F5).';
    }
    // samo tacno oblik https://<ime>.trycloudflare.com - nista drugo (zastita od preusmjeravanja na laznu stranicu)
    function ok(url) { return /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(url); }
    async function go() {
      var t = '?t=' + Date.now();
      try {
        var r = await fetch(API + t, { headers: { 'Accept': 'application/vnd.github.raw' } });
        if (r.ok) { var u = (await r.text()).trim(); if (ok(u)) return prikaziLink(u); }
      } catch (e) {}
      try {
        var r2 = await fetch(RAW + t);
        if (r2.ok) { var u2 = (await r2.text()).trim(); if (ok(u2)) return prikaziLink(u2); }
      } catch (e) {}
      greska();
    }
    go();
  </script>
</body>
</html>
